name: update NEPSE Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * 0-4"

permissions:
  contents: write


jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt


      - name: Run tests
        run: python -m unittest discover -s tests


      - name: Fetch and prepare market data
        run: python -m scripts.fetch_yonepse_data


      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


      - name: Commit updated market data
        run: |
          git add data/generated-stocks.json


          if git diff --cached --quiet; then
            echo "Market data has not changed."
          else
            git commit -m "Update NEPSE market data"
            git push
